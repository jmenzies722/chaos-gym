[project]
name = "chaos-gym"
version = "0.1.0"
description = "Breaks a local Kubernetes cluster on a schedule so you can practice diagnosing real failures against real dashboards."
requires-python = ">=3.11"
dependencies = ["kubernetes>=31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
